<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simon Says Game</title>
  <link rel="stylesheet" href="simon say game.css">
</head>
<body>
  <h1>🎮 SIMON SAYS GAME</h1>
  <h2>Press any key to start the game</h2>

  <div class="btn-container">
    <div class="line-one">
      <div class="btn red" id="red"></div>
      <div class="btn green" id="green"></div>
    </div>
    <div class="line-two">
      <div class="btn yellow" id="yellow"></div>
      <div class="btn blue" id="blue"></div>
    </div>
  </div>

  <script src="simon say game.js"></script>
</body>
</html>
